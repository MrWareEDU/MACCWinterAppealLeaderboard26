<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Appeal — Care Group Leaderboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js"></script>
</head>
<body>
    <div id="app">

        <header class="site-header">
            <div class="header-inner">
                <div class="header-brand">
                    <span class="school-name" id="schoolName"></span>
                    <div>
                        <h1 class="appeal-title" id="appealTitle"></h1>
                        <p class="appeal-subtitle">Care Group Leaderboard</p>
                    </div>
                </div>
                <div class="header-controls">
                    <nav class="year-filters" id="yearFilters" aria-label="Filter by year group"></nav>
                    <a href="assembly.html" class="btn-assembly">Assembly View</a>
                </div>
            </div>
        </header>

        <main class="main-content">

            <div id="loadingState" class="status-state">
                <p>Loading leaderboard data...</p>
            </div>

            <div id="errorState" class="status-state status-error hidden">
                <p>Could not load data. The leaderboard will retry shortly.</p>
                <p class="error-detail" id="errorDetail"></p>
            </div>

            <ol class="leaderboard" id="leaderboardList" aria-label="Care group rankings"></ol>

        </main>

        <footer class="site-footer">
            <span id="lastUpdated"></span>
            <span class="footer-sep">·</span>
            <span>Refreshes every 30 seconds</span>
        </footer>

    </div>
    <script src="js/app.js"></script>
</body>
</html>
